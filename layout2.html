<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>layout2 실습</title>
    <link rel="stylesheet" href="layout2.css" />
  </head>
  <body>
    <!-- 레이아웃 전체 -->
      <div class="container">
        <!-- 헤더 -->
        <header>
          <!-- 좌측 -->
          <div class="left"></div>
          <!-- 중간-->
          <div class="mid"></div>
          <!-- 우측 -->
          <div class="right"></div>
        </header>
        <!-- 메인 -->
        <main>
          <!-- 위 -->
          <div class="top"></div>
          <!-- 아래 -->
          <div class="bottom"></div>
        </main>
        <!-- 하단 -->
        <footer>
          <!-- 좌측 -->
          <div class="b-left"></div>
          <!-- 중간 -->
          <div class="b-mid"></div>
          <!-- 우측 -->
          <div class="b-right"></div>
        </footer>
      </div>
  </body>
</html>
